name: Auto-merge Beta PRs

on:
  pull_request:
    types: [opened, labeled, ready_for_review]
  check_suite:
    types: [completed]

concurrency:
  group: auto-merge-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  auto-merge:
    runs-on: ubuntu-latest

    # GITHUB_TOKEN is read-only here; the merge itself uses AUTOMERGE_PAT.
    permissions:
      contents: read
      pull-requests: read
      checks: read

    steps:
      - name: Check if auto-merge should run
        id: should-run
        run: |
          if [[ "${{ github.event.pull_request.draft }}" == "true" ]]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "reason=PR is draft" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [[ "${{ contains(github.event.pull_request.labels.*.name, 'beta-rule') }}" != "true" ]]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "reason=Missing beta-rule label" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [[ "${{ github.event.pull_request.user.login }}" != "rtk-shripada-rao" ]]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "reason=Not created by bot" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "skip=false" >> $GITHUB_OUTPUT

      - name: Skip message
        if: steps.should-run.outputs.skip == 'true'
        run: |
          echo "Skipping auto-merge: ${{ steps.should-run.outputs.reason }}"

      - name: Check files changed
        if: steps.should-run.outputs.skip == 'false'
        id: check-files
        uses: actions/github-script@v7
        with:
          script: |
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number
            });

            const allowedPatterns = [
              /^intentions\/config_engine\/escalation_status\.json$/,
              /^intentions\/config_shared\/s10_constants_.*\.yaml$/,
              /^intentions\/tests\/baseline\/outcome_validation\/create_escalation\/.*\.json$/,
              /^intentions\/v2\/sigma\/s40_.*\.py$/,
              /^intentions\/s40_.*\.py$/,
              /^rtksigmadetectiongenerator\/rules\/auto_pipeline\/.*\.yml$/
            ];

            const invalidFiles = files.filter(file => {
              return !allowedPatterns.some(pattern => pattern.test(file.filename));
            });

            if (invalidFiles.length > 0) {
              const fileList = invalidFiles.map(f => f.filename).join('\n');
              core.setFailed(`PR modifies files outside allowed paths:\n${fileList}`);
              return false;
            }

            core.info(`All ${files.length} files match allowed patterns`);
            return true;

      - name: Wait for CI to pass
        if: steps.should-run.outputs.skip == 'false' && steps.check-files.outputs.result == 'true'
        uses: lewagon/wait-on-check-action@v1.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          check-name: 'ci'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 30

      # No branch protection in this test repo, so merge directly; use --auto in production.
      - name: Merge PR
        if: steps.should-run.outputs.skip == 'false' && steps.check-files.outputs.result == 'true'
        run: |
          gh pr merge --squash "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_PAT }}
