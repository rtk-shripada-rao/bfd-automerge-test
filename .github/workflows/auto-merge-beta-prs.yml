name: Auto-merge Detection PRs

on:
  # Runs from the default branch after CI finishes, so a PR can't edit these rules. Never check out PR code here.
  workflow_run:
    workflows: [CI]
    types: [completed]

concurrency:
  group: auto-merge-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only successful CI runs on PRs that the app started (by opening the PR or pushing to it); others show as "Skipped".
    if: |
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.actor.login == 'bfd-automerge-test-bot[bot]'

    # GITHUB_TOKEN is read-only here; approve and merge use AUTOMERGE_PAT.
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Check PR and files changed
        id: check-files
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const number = run.pull_requests[0]?.number;
            if (!number) {
              core.notice('No pull request found for this CI run');
              return false;
            }

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: number
            });

            if (pr.state !== 'open' || pr.draft || pr.user.login !== 'bfd-automerge-test-bot[bot]') {
              core.notice(`Skipping PR #${number}: state=${pr.state}, draft=${pr.draft}, author=${pr.user.login}`);
              return false;
            }

            // A newer push has its own CI run, which will trigger this workflow again.
            if (pr.head.sha !== run.head_sha) {
              core.notice(`Skipping PR #${number}: CI ran on ${run.head_sha}, but the PR is now at ${pr.head.sha}`);
              return false;
            }

            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: number,
              per_page: 100
            });

            const allowedPatterns = [
              /^detections\/engine\/rule_status\.json$/,
              /^detections\/shared\/constants_autopipeline_.*\.yaml$/,
              /^detections\/tests\/rule_autopipeline_.*\.json$/,
              /^detections\/v2\/rule_autopipeline_.*\.py$/,
              /^detections\/rule_autopipeline_.*\.py$/,
              /^generator\/rules\/auto_pipeline\/.*\.yml$/
            ];

            const invalidFiles = files.filter(file => {
              return !allowedPatterns.some(pattern => pattern.test(file.filename));
            });

            if (invalidFiles.length > 0) {
              const fileList = invalidFiles.map(f => f.filename).join('\n');
              core.setFailed(`PR modifies files outside allowed paths:\n${fileList}`);
              return false;
            }

            // Block promotions to ga: any added line in rule_status.json that sets a value to "ga".
            const status = files.find(f => f.filename === 'detections/engine/rule_status.json');
            if (status && /^\+.*:\s*"ga"/m.test(status.patch || '')) {
              core.setFailed('GA auto-merging is disabled');
              return false;
            }

            core.setOutput('pr', number);
            core.info(`All ${files.length} files match allowed patterns`);
            return true;

      - name: Approve PR
        if: steps.check-files.outputs.result == 'true'
        run: |
          gh pr review --approve "$PR" --repo "$REPO"
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_PAT }}
          PR: ${{ steps.check-files.outputs.pr }}
          REPO: ${{ github.repository }}

      # --match-head-commit refuses the merge if commits were pushed after CI ran on this commit.
      - name: Merge PR
        if: steps.check-files.outputs.result == 'true'
        run: |
          gh pr merge "$PR" --repo "$REPO" --squash --match-head-commit "$HEAD_SHA"
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_PAT }}
          PR: ${{ steps.check-files.outputs.pr }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
