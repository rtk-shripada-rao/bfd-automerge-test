name: Auto-merge Detection PRs

on:
  # Runs the workflow from the base branch, so a PR can't edit the rules it's judged by. Never check out PR code here.
  pull_request_target:
    types: [opened, ready_for_review, synchronize]

concurrency:
  group: auto-merge-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Skip the workflow entirely for drafts and different author - shows as "Skipped" in checks UI
    if: |
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.login == '26-srsd-sigma-automation-pipeline[bot]'

    # GITHUB_TOKEN is read-only here; approve and merge use AUTOMERGE_PAT.
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Check files changed
        id: check-files
        uses: actions/github-script@v7
        with:
          script: |
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100
            });

            const allowedPatterns = [
              /^intentions\/config_engine\/escalation_status\.json$/,
              /^intentions\/config_shared\/s10_constants_sigma_autopipeline_.*\.yaml$/,
              /^intentions\/tests\/baseline\/outcome_validation\/create_escalation\/s40_escalate_sigma_autopipeline_.*\.json$/,
              /^intentions\/v2\/sigma\/s40_escalate_sigma_autopipeline_.*\.py$/,
              /^intentions\/s40_escalate_sigma_autopipeline_.*\.py$/,
              /^rtksigmadetectiongenerator\/rules\/auto_pipeline\/.*\.yml$/
            ];

            const invalidFiles = files.filter(file => {
              return !allowedPatterns.some(pattern => pattern.test(file.filename));
            });

            if (invalidFiles.length > 0) {
              const fileList = invalidFiles.map(f => f.filename).join('\n');
              core.setFailed(`PR modifies files outside allowed paths:\n${fileList}`);
              return false;
            }

            core.info(`All ${files.length} files match allowed patterns`);
            return true;

      # Wait and continue after the other CI checks complete
      - name: Wait for required checks
        if: steps.check-files.outputs.result == 'true'
        run: |
          count=0
          for _ in $(seq 1 50); do
            count=$(gh pr checks "$PR" --repo "$REPO" --required --json name --jq 'length' 2>/dev/null || echo 0)
            [[ "$count" -gt 0 ]] && break
            sleep 15
          done
          if [[ "$count" -eq 0 ]]; then
            echo "No required checks registered on this PR"
            exit 1
          fi
          gh pr checks "$PR" --repo "$REPO" --required --watch --fail-fast --interval 30
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_PAT }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}

      - name: Approve PR
        if: steps.check-files.outputs.result == 'true'
        run: |
          gh pr review --approve "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_PAT }}

      # Required checks passed in the wait step, so merge now (repo auto-merge is off).
      # --match-head-commit refuses the merge if commits were pushed after this run started.
      - name: Merge PR
        if: steps.check-files.outputs.result == 'true'
        run: |
          gh pr merge "$PR" --repo "$REPO" --squash --match-head-commit "$HEAD_SHA"
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_PAT }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
