name: Auto-merge Detection PRs

on:
  # Runs the workflow from the base branch, so a PR can't edit the rules it's judged by. Never check out PR code here.
  pull_request_target:
    types: [opened, labeled, ready_for_review]
  check_suite:
    types: [completed]

concurrency:
  group: auto-merge-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # Skip the workflow entirely for drafts and wrong author - shows as "Skipped" in checks UI
    if: |
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.login == 'bfd-automerge-test-bot[bot]'

    # GITHUB_TOKEN is read-only here; approve and merge use AUTOMERGE_PAT.
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Check files changed
        id: check-files
        uses: actions/github-script@v7
        with:
          script: |
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number
            });

            const allowedPatterns = [
              /^detections\/engine\/rule_status\.json$/,
              /^detections\/shared\/constants_autopipeline_.*\.yaml$/,
              /^detections\/tests\/rule_autopipeline_.*\.json$/,
              /^detections\/v2\/rule_autopipeline_.*\.py$/,
              /^detections\/rule_autopipeline_.*\.py$/,
              /^generator\/rules\/auto_pipeline\/.*\.yml$/
            ];

            const invalidFiles = files.filter(file => {
              return !allowedPatterns.some(pattern => pattern.test(file.filename));
            });

            if (invalidFiles.length > 0) {
              const fileList = invalidFiles.map(f => f.filename).join('\n');
              core.setFailed(`PR modifies files outside allowed paths:\n${fileList}`);
              return false;
            }

            core.info(`All ${files.length} files match allowed patterns`);
            return true;

      - name: Wait for required checks
        if: steps.should-run.outputs.skip == 'false' && steps.check-files.outputs.result == 'true'
        run: |
          gh pr checks "$PR" --repo "$REPO" --required --watch --fail-fast --interval 30
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_PAT }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}

      - name: Approve PR
        if: steps.check-files.outputs.result == 'true'
        run: |
          gh pr review --approve "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_PAT }}

      # Test repo only: leaves time to see the approval in the PR UI before merging.
      - name: Pause after approval
        if: steps.check-files.outputs.result == 'true'
        env:
          PAUSE_SECONDS: 60
        run: sleep "$PAUSE_SECONDS"

      # Checks already passed in the wait step, so merge immediately.
      # --match-head-commit refuses the merge if commits were pushed after this run started.
      - name: Merge PR
        if: steps.check-files.outputs.result == 'true'
        run: |
          gh pr merge "$PR" --repo "$REPO" --squash --match-head-commit "$HEAD_SHA"
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_PAT }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
